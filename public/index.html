<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SVG favicon: scales cleanly and needs no .ico toolchain. The starter
         referenced a favicon.ico that was not in the repo, which 404'd. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="theme-color" content="#8c0a1c" />

    <meta
      name="description"
      content="Delegate application form for the Harvard College Project for Asian and International Relations."
    />

    <!--
      Poppins is the typeface used on hpair.org. Loaded from Google Fonts with
      preconnect so the handshake overlaps parsing, and `display=swap` so text
      renders immediately in the fallback stack rather than blocking on the font.
      Only the weights actually used are requested (300/400/500/600/700).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Delegate Application · HPAIR</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
